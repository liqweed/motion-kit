# Jig configuration (https://jig-harness.dev). Every field, its default and
# the skills that read it: CONFIGURATION.md in the installed jig plugin.
# Check it: bun <plugin>/skills/audit/scripts/config-fit.ts
gates:
  # Full local checks before a push: typecheck, versions, tests, scene gate, media freshness.
  command: npm run gate
repository:
  base_branch: main
review:
  repo_slug: liqweed/motion-kit
  bots: ["docomply-review[bot]"]
  # ai-review (docomply/ai-review, on majordomo) watches this repository through
  # AI_REVIEW_EXTRA_REPOS and posts `AI review (motion-kit)` on every head, drafts
  # included. Its check name and summary markers match Jig's defaults, so no
  # pattern is set. If the service stops watching this repository, unset both
  # this and drive.reviews_drafts: a drive expecting a reviewer that never posts
  # sits in AWAITING_REVIEWER until it times out.
  reviewer_app: docomply-review
drive:
  # The service runs with AI_REVIEW_REVIEW_DRAFTS=true.
  reviews_drafts: true
issue_tracker:
  adapter: github # GitHub Issues on liqweed/motion-kit
  # Repo-local taxonomy; also overrides the one set in ~/.jig/jig.yaml.
  taxonomy: .config/label-taxonomy.yaml
  file_command: /jig:file-issue
  facets:
    type: { store: native } # GitHub issue types: Bug, Feature, Task
    priority: { store: label } # "priority: urgent|high|medium|low"
    size: { store: label } # small | medium | large
ci:
  # The `gate` (Node from .nvmrc) and `gate-node22` (the engines floor) jobs of
  # .github/workflows/ci.yml, which run on pushes to main; the changelog
  # workflow tags a release once both passed on the releasing commit.
  required_checks: [gate, gate-node22]
changelog:
  file: CHANGELOG.md
  format: keep-a-changelog
  release_paths: [cli/, lib/, runtime/, adapters/, styles/, skills/, examples/, brand/, .claude-plugin/]
  version:
    files:
      - { path: package.json, key: version }
  # The plugin manifests and the lock file repeat the version.
  after_version: node scripts/sync-version.mjs
  # A merged change note releases at once: the release App pushes the release
  # commit to main (no release pull request), then CI, the tag and the Release
  # workflow follow. main's rules must let that push through: no required pull
  # request, status check or signed commit, or the App listed as a bypass actor.
  release:
    push: direct
  # A note without a `release` level waits for the next release, as before,
  # instead of costing a commit on main per merge (`write`, the default under
  # `direct`).
  unreleased: wait
