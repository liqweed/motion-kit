# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration. Repo rules live in AGENTS.md; keep this in step.
language: en-US
early_access: false
tone_instructions: "Direct and concise. Flag real defects and rule violations; skip style nits the gate or formatter already covers."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    # Generated by `npm run media`; reviewers see the diff but not line-level noise.
    - "!docs/media/**"
    - "!assets/icon*"
    - "!.idea/**"
    - "!package-lock.json"
    - "!node_modules/**"
    - "!out/**"

  path_instructions:
    - path: "runtime/**"
      instructions: |
        Runs in the browser AND Node and is vendored verbatim by consumers.
        Flag: `node:` imports, DOM access at import time (player.mjs may touch
        the DOM only when mounted), any dependency, anything needing a build step.
        Public helpers need JSDoc types and a unit test in test/.
    - path: "lib/**"
      instructions: |
        Node only. `@resvg/resvg-js` and ffmpeg are optional: flag code that
        crashes instead of degrading with a clear message when either is missing.
        Must stay compatible with Node 22.
    - path: "cli/**"
      instructions: |
        A flag or behaviour change must update the matching skills/*/SKILL.md or
        references/*.md in the same PR. Check --help text stays accurate.
    - path: "adapters/**"
      instructions: "Copied into consumer repos by `motion-kit vendor`. Keep them thin wrappers over runtime/."
    - path: "{examples,brand}/**/*.{mjs,json}"
      instructions: |
        Scenes are pure functions of time: frame(t) may read only t and constants.
        Flag Date, Math.random, performance.now, state carried between frames,
        colour literals instead of tok("..."), numbers not rounded through num(),
        unescaped labels (use text()/esc()), motion at a step's `at`, and total
        duration beyond ~8-10 s. brand/logo.scene.mjs takes the runtime from `kit`.
    - path: "skills/**"
      instructions: |
        Plugin skills used by agents in other repos. Check instructions match the
        CLI's actual flags and behaviour, and that front matter is valid.
    - path: "test/**"
      instructions: "node:test + node:assert/strict. Tests must be deterministic: no clocks, randomness or network."
    - path: "docs/spec/**"
      instructions: "Normative contract. Changes to scene, time model, targets or gate must be reflected here; resolve entries in its Discrepancies list rather than adding to it."
    - path: "{package.json,.claude-plugin/*.json}"
      instructions: "`version` in package.json and both .claude-plugin/*.json must be bumped together (`npm run versions`)."

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    # JS/TS lint is covered by tsc and the scene gate; keep the signal high.
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/spec/technique.md"
      - "skills/animated-diagram/references/*.md"

code_generation:
  docstrings:
    language: en-US
  unit_tests:
    path_instructions: []
