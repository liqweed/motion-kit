# Git hooks (https://lefthook.dev). Installed by `npm install` (prepare script).
# Skip once with LEFTHOOK=0 git commit …; never skip pre-push for a PR branch.
pre-commit:
  parallel: true
  jobs:
    - name: typecheck
      glob: "*.mjs"
      run: npm run -s typecheck
    - name: scene-gate
      glob: "{runtime,lib,examples,brand,styles}/**/*"
      run: npm run -s check
    - name: media-fresh
      glob: "{runtime,examples,brand,styles}/**/*"
      run: npm run -s media:check
    - name: versions
      glob: "{package.json,.claude-plugin/*.json}"
      run: npm run -s versions

commit-msg:
  jobs:
    - name: conventional-commit
      run: node scripts/check-commit-msg.mjs {1}

pre-push:
  jobs:
    - name: gate
      run: npm run -s gate
