name: Deploy site

# Builds website/ with Astro and deploys dist/ to Cloudflare with the cf CLI.
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts write; Workers Routes, DNS and
# Zone read on motion-kit.dev) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["website/**", "runtime/**", "examples/**", "brand/**", "assets/icon.svg", "docs/media/**", "package.json", "package-lock.json", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run site:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
