name: Release

# Push a tag vX.Y.Z (matching package.json) to run the gate, publish
# @liqweed/motion-kit to npm with provenance and create the GitHub release.
# Auth is npm trusted publishing (OIDC): no token. The first version of a
# package is published by hand.
#
# Configure the Trusted Publisher once on npmjs.com: the package's Settings ->
# Trusted publishing -> GitHub Actions. Every field is case-sensitive, and npm
# does not check them when you save, so a wrong value only shows at publish:
#   Organization or user:  liqweed
#   Repository:            motion-kit
#   Workflow filename:     release.yml
#   Environment name:      (empty)
#   Allowed actions:       npm publish (allow it; "npm stage publish" is always on)
# The job sets no `environment:`, so keep the environment empty: an entry that
# names one (the first entry named `release`) never matches this workflow.
# An entry created after 2026-09-03 allows only "npm stage publish" until you
# also allow "npm publish", which is what the step below runs. The first entry
# had both mistakes (#32), and `npm publish` failed with E403 "OIDC permission
# denied for this action".
# The fields above cannot be edited once saved: delete the entry and add it
# again. An entry that has not published within 2 days expires; recreate it the
# same way and re-run right away.
#
# To publish a tag whose Release run failed, fix the setting and re-run that run
# from the Actions tab. Re-run older tags first: `npm publish` without --tag
# refuses a version below the highest one already on npm, so a newer tag
# published first blocks the older one for good.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run gate
      - name: Publish (skipped if this version is already on npm)
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@liqweed/motion-kit@$v" version >/dev/null 2>&1; then
            echo "@liqweed/motion-kit@$v already published; skipping"
          else
            npm install -g npm@^11.5.1
            npm publish
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
