name: Release

# Push a tag vX.Y.Z (matching package.json) to run the gate, publish
# @liqweed/motion-kit to npm with provenance and create the GitHub release.
# Auth is npm trusted publishing (OIDC): no token. Configure it once on
# npmjs.com -> package settings -> Trusted Publisher: repo liqweed/motion-kit,
# workflow release.yml. The first version of a package is published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run gate
      - name: Publish (skipped if this version is already on npm)
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "@liqweed/motion-kit@$v" version >/dev/null 2>&1; then
            echo "@liqweed/motion-kit@$v already published; skipping"
          else
            npm install -g npm@^11.5.1
            npm publish
          fi
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
